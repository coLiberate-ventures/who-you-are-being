<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16">
  <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2eddf">
  <meta name="description" content="Who you are being is primary.">
  <title>Who You Are Being Is Primary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cormorant+Garamond:ital,wght@1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f2eddf;
      --ink: #151515;
      --signal: #f3d51f;
      --ease-out: cubic-bezier(.16, 1, .3, 1);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.72'/%3E%3C/svg%3E");
    }

    main {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(1rem, 3vw, 2.75rem);
    }

    .statement {
      width: min(100%, 96rem);
      margin: 0;
      font-family: "Archivo Black", "Arial Black", sans-serif;
      font-size: clamp(3.15rem, 10.7vw, 10.8rem);
      font-weight: 900;
      line-height: .79;
      letter-spacing: -.075em;
      text-transform: uppercase;
      text-wrap: balance;
      user-select: none;
    }

    .line {
      display: block;
      position: relative;
      overflow: hidden;
      padding: .09em .02em .13em;
      margin: -.09em 0 -.13em;
    }

    .line:nth-child(2) { text-align: right; }

    .reveal {
      display: block;
      transform: translateY(118%) rotate(2deg);
      animation: arrive 1.15s var(--ease-out) forwards;
      animation-delay: var(--delay);
    }

    .being {
      display: inline-block;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.32em;
      font-weight: 600;
      line-height: .55;
      letter-spacing: -.065em;
      text-transform: none;
      transform-origin: center;
    }

    .primary {
      position: relative;
      z-index: 0;
      display: inline-block;
      padding: .025em .085em .075em .025em;
      margin-left: -.025em;
    }

    .primary::before {
      content: "";
      position: absolute;
      z-index: -1;
      left: -.015em;
      right: -.015em;
      top: .07em;
      bottom: .05em;
      background: var(--signal);
      transform: scaleX(0);
      transform-origin: left center;
      animation: mark 1.05s var(--ease-out) 1.95s forwards;
    }

    .primary::after {
      content: "";
      position: absolute;
      left: 0;
      right: .06em;
      bottom: -.005em;
      height: .025em;
      background: var(--ink);
      transform: scaleX(0);
      transform-origin: left;
      animation: mark .8s var(--ease-out) 2.4s forwards;
    }

    @keyframes arrive {
      from { transform: translateY(118%) rotate(2deg); }
      to { transform: translateY(0) rotate(0); }
    }

    @keyframes mark {
      to { transform: scaleX(1); }
    }

    @media (max-width: 680px) {
      .statement {
        font-size: clamp(3rem, 15.3vw, 6rem);
        line-height: .83;
      }

      .line:nth-child(2) { text-align: left; }
      .being { font-size: 1.27em; }
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal { transform: none; animation: none; }
      .primary::before,
      .primary::after { transform: scaleX(1); animation: none; }
    }
  </style>
</head>
<body>
  <main aria-label="Who you are being is primary">
    <h1 class="statement">
      <span class="line"><span class="reveal" style="--delay: .12s">Who you are</span></span>
      <span class="line"><span class="reveal" style="--delay: .54s"><em class="being">being</em></span></span>
      <span class="line"><span class="reveal" style="--delay: .96s">is <span class="primary">primary.</span></span></span>
    </h1>
  </main>
</body>
</html>
